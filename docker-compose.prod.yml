version: "3.8"

services:
  db:
    restart: always

  server:
    image: ${DOCKERHUB_USERNAME}/carrion-back:latest
    restart: always

  client_web:
    image: ${DOCKERHUB_USERNAME}/carrion-front:latest
    environment:
      - NEXT_PUBLIC_API_URL=https://${DOMAIN_NAME:-carrion.website}/api
    restart: always

  caddy:
    image: caddy:latest
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - api-tier
    depends_on:
      - server
      - client_web

volumes:
  caddy_data:
  caddy_config:
